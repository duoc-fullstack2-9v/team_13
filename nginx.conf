server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sirve assets estáticos y hace fallback a index.html para rutas de SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: desactiva logs de acceso para assets comunes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }
}
